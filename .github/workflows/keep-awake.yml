# Render's free plan puts the API to sleep after 15 idle minutes. A sleeping API drops the linked
# WhatsApp number and misses phone calls, so this pings it every 10 minutes. Free on public repos.
# GitHub may delay scheduled runs by a few minutes; the API also pings itself while awake.
name: Keep API awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 60 "${API_URL:-https://cm-helpline-uttarakhand-api.onrender.com}/api/health"
        env:
          API_URL: ${{ vars.API_URL }}
